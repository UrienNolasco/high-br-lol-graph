name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - name: Enforce strict architecture boundaries
        run: npm run architecture:check -- --strict
        env:
          ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
